<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>Дофаминовый замок — вариант A</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f3f1;--white:#fff;--lime:#d5fc6a;--blue:#2558fc;--text:#111;--muted:#666;--border:#d8d7d1;
--font:'Onest',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
body{width:640px;height:800px;background:var(--bg);font-family:var(--font);color:var(--text);
display:flex;flex-direction:column;padding:28px 30px 26px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);
font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue)}
.top .r{color:var(--muted)}
.frame{margin-top:20px;height:392px;position:relative;overflow:hidden;background:#cbd9e6}
/* утро после дождя: тёплый горизонт, холодная высота */
.sky{position:absolute;inset:0;background:
linear-gradient(180deg,#93b2cc 0%,#c7d3dc 38%,#e8ded0 62%,#f2e2cd 78%,#e6d6c4 100%)}
.sun{position:absolute;left:63%;top:52%;width:230px;height:230px;transform:translate(-50%,-50%);
background:radial-gradient(circle,rgba(255,236,199,.95) 0%,rgba(255,232,190,.45) 38%,rgba(255,232,190,0) 70%)}
/* размытая вертикаль дома — по касательной, как в ТЗ Германа */
.tower{position:absolute;left:0;top:0;bottom:0;width:96px;background:linear-gradient(90deg,rgba(54,66,78,.70),rgba(54,66,78,.06));filter:blur(2px)}
.city{position:absolute;left:0;right:0;top:150px;height:66px;opacity:.30;filter:blur(1.2px);
background:
linear-gradient(90deg,transparent 6%,#5c6a78 6%,#5c6a78 11%,transparent 11%,transparent 17%,#5c6a78 17%,#5c6a78 20%,transparent 20%,transparent 29%,#5c6a78 29%,#5c6a78 37%,transparent 37%,transparent 46%,#5c6a78 46%,#5c6a78 50%,transparent 50%,transparent 58%,#5c6a78 58%,#5c6a78 66%,transparent 66%,transparent 74%,#5c6a78 74%,#5c6a78 79%,transparent 79%,transparent 88%,#5c6a78 88%,#5c6a78 94%,transparent 94%);
-webkit-mask-image:linear-gradient(180deg,transparent,#000 60%)}
.rail{position:absolute;left:0;top:0}
/* терраса: мокрый камень */
.slab{position:absolute;left:0;right:0;bottom:0;height:146px;
background:linear-gradient(180deg,#b9ae9f 0%,#a89c8c 40%,#9c8f7f 100%)}
.wet{position:absolute;left:0;right:0;bottom:0;height:150px;
background:linear-gradient(180deg,rgba(255,240,214,.42),rgba(255,240,214,0) 55%)}
.cupwrap{position:absolute;right:52px;bottom:26px;width:196px;height:132px}
.shadow{position:absolute;left:-14px;bottom:6px;width:150px;height:16px;
background:radial-gradient(ellipse,rgba(40,30,20,.34),rgba(40,30,20,0) 70%)}
svg{display:block}
.tag{position:absolute;left:16px;top:16px;font-family:var(--mono);font-size:9px;font-weight:700;
letter-spacing:1.6px;color:#fff;background:rgba(17,17,17,.55);padding:5px 8px}
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.8px;
text-transform:uppercase;color:var(--blue);margin-bottom:14px}
h1{font-size:52px;font-weight:700;line-height:1.02;letter-spacing:-1.4px}
h1 span{background:var(--lime);padding:0 8px;margin-left:-8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.concept{margin-top:18px;font-family:var(--mono);font-size:11.5px;line-height:1.65;color:#3d3d3d;
border-left:2px solid var(--lime);padding-left:12px;max-width:520px}
.foot{margin-top:22px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding-top:16px}
.mark{width:30px;height:30px;background:var(--blue);color:#fff;display:flex;align-items:center;
justify-content:center;font-size:16px;line-height:1}
.foot .t{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.foot .t b{color:var(--text);display:block;letter-spacing:1.2px}
</style></head><body>
<div class="top"><span>[ Как нейробиолог квартиры продавал ]</span><span class="r">/ Глава 01</span></div>

<div class="frame">
  <div class="sky"></div><div class="sun"></div>
  <div class="city"></div>
  <div class="tower"></div>
  <div class="slab"></div><div class="wet"></div>
  <svg class="rail" width="580" height="392" viewBox="0 0 580 392">
    <g stroke="rgba(255,255,255,.5)" stroke-width="1">
      <line x1="0" y1="214" x2="580" y2="214"/>
      <line x1="0" y1="246" x2="580" y2="246" stroke="rgba(255,255,255,.3)"/>
      <line x1="150" y1="214" x2="150" y2="250" stroke="rgba(255,255,255,.28)"/>
      <line x1="330" y1="214" x2="330" y2="250" stroke="rgba(255,255,255,.28)"/>
      <line x1="510" y1="214" x2="510" y2="250" stroke="rgba(255,255,255,.28)"/>
    </g>
    <g stroke="rgba(255,255,255,.16)" stroke-width="1">
      <line x1="60" y1="392" x2="150" y2="252"/>
      <line x1="250" y1="392" x2="290" y2="252"/>
      <line x1="470" y1="392" x2="430" y2="252"/>
    </g>
  </svg>
  <div class="cupwrap">
    <svg width="196" height="132" viewBox="0 0 196 132">
      <g stroke="rgba(30,24,18,.32)" stroke-width="1.3" fill="none">
        <path d="M96 34 c-4 -14 5 -18 1 -31" opacity=".5"/>
        <path d="M112 36 c-4 -16 6 -21 2 -34" opacity=".32"/>
      </g>
      <ellipse cx="98" cy="118" rx="66" ry="9" fill="rgba(40,30,20,.18)"/>
      <ellipse cx="98" cy="112" rx="60" ry="11" fill="#efece4"/>
      <ellipse cx="98" cy="109" rx="60" ry="11" fill="#f7f5f0"/>
      <path d="M150 62 c19 1 20 26 -1 28" stroke="#f7f5f0" stroke-width="8" fill="none"/>
      <path d="M52 54 h92 v22 c0 22 -17 34 -46 34 s-46 -12 -46 -34z" fill="#fbfaf7"/>
      <path d="M52 54 h92 v8 c0 5 -21 8 -46 8 s-46 -3 -46 -8z" fill="#f0ede6"/>
      <path d="M59 62 c10 3 26 5 39 5 s29 -2 39 -5 v7 c-10 3 -26 5 -39 5 s-29 -2 -39 -5z" fill="#5a3820"/>
      <path d="M52 54 h92 v22 c0 22 -17 34 -46 34 s-46 -12 -46 -34z" fill="none" stroke="rgba(30,24,18,.16)"/>
      <path d="M6 96 l40 -6 l2 8 l-40 6z" fill="#f2efe8" opacity=".9"/>
    </svg>
  </div>
  <div class="tag">Рендер · не фотография</div>
</div>

<div class="body">
  <div class="eyebrow">✦ Сатирическая проза · рассказ первый</div>
  <h1>Дофаминовый<br><span>замок</span></h1>
  <div class="concept">Дофамин — медиатор предвкушения, а не удовольствия.<br>Нейрон разряжается на сигнал о награде, а не на саму награду.</div>
  <div class="foot">
    <div class="mark">✦</div>
    <div class="t"><b>Прагматик · Система</b>sistema.pragmatiq.online / stories</div>
  </div>
</div>
</body></html>
