<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>Дофаминовый замок — вариант C</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--lime:#d5fc6a;--blue:#2558fc;--ink:#111;--font:'Onest',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
body{width:640px;height:800px;background:var(--ink);font-family:var(--font);color:#fff;
display:flex;flex-direction:column;padding:28px 30px 26px;position:relative;overflow:hidden}
.glow{position:absolute;right:-170px;top:80px;width:520px;height:520px;border-radius:50%;
background:radial-gradient(circle,rgba(213,252,106,.13) 0%,rgba(213,252,106,0) 66%)}
.glow2{position:absolute;left:-180px;bottom:-140px;width:520px;height:520px;border-radius:50%;
background:radial-gradient(circle,rgba(37,88,252,.38) 0%,rgba(37,88,252,0) 68%)}
.top{position:relative;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);
font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--lime)}
.top .r{color:rgba(255,255,255,.45)}
.num{position:relative;margin-top:26px;font-family:var(--mono);font-size:120px;font-weight:700;
line-height:.82;letter-spacing:-6px;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.28)}
.spike{position:relative;display:block;margin-top:18px}
.quote{position:relative;margin-top:auto;font-size:46px;font-weight:700;line-height:1.06;letter-spacing:-1.2px}
.quote .l{background:var(--lime);color:var(--ink);padding:0 8px;margin-left:-8px}
.quote .w{background:#fff;color:var(--ink);padding:0 8px;margin-left:-8px}
.attr{position:relative;margin-top:20px;font-family:var(--mono);font-size:11px;line-height:1.7;
color:rgba(255,255,255,.62);border-left:2px solid var(--blue);padding-left:12px}
.title{position:relative;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);
display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.title h1{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.08}
.title .c{font-family:var(--mono);font-size:9.5px;line-height:1.6;letter-spacing:1px;
text-transform:uppercase;color:rgba(255,255,255,.5);text-align:right;flex-shrink:0}
.foot{position:relative;margin-top:20px;display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px}
.foot .t{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.foot .t b{color:#fff;display:block;letter-spacing:1.2px}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="top"><span>[ Орбит-фронтальный переход ]</span><span class="r">/ Глава 01</span></div>
<div class="num">01</div>
<svg class="spike" width="580" height="210" viewBox="0 0 580 210">
  <line x1="0" y1="150" x2="580" y2="150" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
  <path d="M0 150 H150 L156 150 L163 26 L171 150 H430 L436 150 L440 166 L446 150 H580"
        fill="none" stroke="#d5fc6a" stroke-width="2.5"/>
  <circle cx="163" cy="26" r="5" fill="#d5fc6a"/>
  <text x="176" y="32" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#d5fc6a">СИГНАЛ</text>
  <text x="452" y="172" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="rgba(255,255,255,.55)">НАГРАДА</text>
  <line x1="440" y1="150" x2="440" y2="60" stroke="rgba(255,255,255,.2)" stroke-width="1" stroke-dasharray="3 4"/>
</svg>

<div class="quote">Счастье —<br><span class="w">это когда</span><br><span class="l">ждёшь</span></div>
<div class="attr">— А когда дождался, это уже не счастье.<br>Это имущество.</div>

<div class="title">
  <h1>Дофаминовый замок</h1>
  <div class="c">Дофамин —<br>предвкушение,<br>не удовольствие</div>
</div>

<div class="foot">
  <div class="mark">✦</div>
  <div class="t"><b>Прагматик · Система</b>sistema.pragmatiq.online / stories</div>
</div>
</body></html>
