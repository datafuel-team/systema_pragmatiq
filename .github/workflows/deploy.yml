name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Diag — secret key fingerprint
        run: |
          FP=$(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')
          echo "fingerprint: $FP"
          test "$FP" = "SHA256:iPBdKeYfLQnGjLTAIjb6aGsqoJhF0nZt/Voc7TG83LE"

      - name: Diag — server port 22 reachable
        run: timeout 15 bash -c 'cat < /dev/null > /dev/tcp/200.165.233.251/22'

      - name: Deploy static
        run: |
          ssh-keyscan -H 200.165.233.251 >> ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20" \
            site/dist/ deploy@200.165.233.251:/var/www/sistema/
