<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f3f1;--white:#fff;--lime:#d5fc6a;--blue:#2558fc;--text:#111;--muted:#666;--border:#d8d7d1;
--font:'Onest',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
body{width:1200px;height:630px;background:var(--bg);color:var(--text);font-family:var(--font);position:relative;overflow:hidden}
.card{position:absolute;inset:40px;background:var(--white);border:1px solid var(--border);padding:52px 60px 48px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{height:34px;display:block}
.tag{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
background:var(--lime);color:var(--text);padding:9px 16px 8px}
.eyebrow{margin-top:56px;font-family:var(--mono);font-size:16px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:12px}
.eyebrow b{font-weight:400}
h1{margin-top:14px;font-size:66px;font-weight:700;line-height:1.08;letter-spacing:-2px;max-width:1000px}
h1 span{color:var(--blue)}
.sub{margin-top:20px;font-size:24px;line-height:1.35;color:var(--muted);max-width:760px}
.foot{margin-top:auto;padding-top:22px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
font-family:var(--mono);font-size:17px;letter-spacing:.5px}
.foot .url{color:var(--blue);font-weight:500}
.foot .sec{color:var(--muted);display:flex;gap:22px}
.foot .sec i{font-style:normal;color:var(--blue);margin-right:6px}
</style></head><body>
<div class="card">
  <div class="top">
    <img class="logo" src="../public/img/logo-pragmatiq.svg" alt="Прагматик">
    <div class="tag">↳ Система</div>
  </div>
  <div class="eyebrow"><span>✦</span><b>Контент-хаб агентства Прагматик</b></div>
  <h1>Система прагматичного маркетинга <span>недвижимости</span></h1>
  <p class="sub">Методологии, инструменты и кейсы для маркетинга застройщиков. Цифры вместо оценок.</p>
  <div class="foot">
    <span class="url">sistema.pragmatiq.online</span>
    <span class="sec"><span><i>✦</i>База знаний</span><span><i>✦</i>Продукты</span><span><i>✦</i>Кейсы</span><span><i>✦</i>Статьи</span></span>
  </div>
</div>
</body></html>
